<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optisol Global</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Optisol Global</h1>
    <p>Industrial Chemicals & Packaging Solutions</p>
</header>

<nav>
    <a href="#about">About</a>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
</nav>

<section id="about">
    <h2>About Us</h2>
    <p>Optisol Global is a trusted supplier of Cutting Oil, Silicone Oil, VCI Packaging, Bubble Wrap and Industrial Chemicals.</p>
</section>

<section id="products">
    <h2>Our Products</h2>

    <div class="product-card">
        <h3>Cutting Oil</h3>
        <button class="btn-secondary">Request RFQ</button>
    </div>

    <div class="product-card">
        <h3>Silicone Oil</h3>
        <button class="btn-secondary">Request RFQ</button>
    </div>

    <div class="product-card">
        <h3>VCI Packaging</h3>
        <button class="btn-secondary">Request RFQ</button>
    </div>
</section>

<section id="contact">
    <h2>Contact Us</h2>

    <form class="contact-form">
        <input type="text" placeholder="Your Name" required><br><br>
        <input type="email" placeholder="Your Email" required><br><br>
        <input type="text" placeholder="Subject" required><br><br>

        <textarea placeholder="Your Message" required></textarea><br><br>

        <button type="submit">Send Message</button>
    </form>
</section>

<script src="script.js"></script>

</body>
</html>
